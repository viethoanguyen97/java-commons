# ===========================================
# Spring Batch Tutorial — Application Config
# ===========================================

# H2 in-memory database configuration
# Used for both Spring Batch metadata tables and application data
spring.datasource.url=jdbc:h2:mem:batchdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
# 'update' mode creates/updates the employee_salary table based on the @Entity definition
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Spring Batch settings
# 'always' creates the batch metadata tables (BATCH_JOB_INSTANCE, BATCH_JOB_EXECUTION, etc.)
# These tables are required by Spring Batch to track job execution state
spring.batch.jdbc.initialize-schema=always

# Prevent job from auto-launching on startup; tests launch the job explicitly
# via JobLauncherTestUtils. Remove this line to enable auto-launch in production.
spring.batch.job.name=
